[mcp_servers.wandb-grpo]
command = "/Users/noamc/miniconda3/bin/conda"
args = [
    "run",
    "-n",
    "grpo_chess",
    "--cwd",
    "/Users/noamc/repos/grpo_chess",
    "--no-capture-output",
    "python",
    "-m",
    "mcp_wandb_server.server",
]

[mcp_servers.wandb-grpo.env]
WANDB_PROJECT = "Chess-GRPO-Bot"

[mcp_servers.wandb-grpo.tools.get_run_summary]
approval_mode = "approve"

[mcp_servers.wandb-grpo.tools.sample_metrics]
approval_mode = "approve"

[mcp_servers.wandb-grpo.tools.get_run_metrics]
approval_mode = "approve"

[mcp_servers.wandb-grpo.tools.list_runs]
approval_mode = "approve"

[mcp_servers.wandb-grpo.tools.compare_runs]
approval_mode = "approve"

[mcp_servers.wandb-grpo.tools.get_plots]
approval_mode = "approve"

[mcp_servers.wandb-pretrain]
command = "/Users/noamc/miniconda3/bin/conda"
args = [
    "run",
    "-n",
    "grpo_chess",
    "--cwd",
    "/Users/noamc/repos/grpo_chess",
    "--no-capture-output",
