# Distillation config for building a GRPO warm-start from DeepMind's 9M data.

generate:
  teacher_model: "9M"
  checkpoint_dir: "searchless_chess/checkpoints"
  checkpoint_step: 6400000
  teacher_batch_size: 512
  top_k: 8
  teacher_temperature: 1.0
  output_dir: "data/distill_9m"
  shard_size: 50000
  min_elo: 1800
  max_samples: 200000
  skip_first_n_moves: 5
  skip_last_n_moves: 5
  sample_positions_per_game: 3

deepmind_data:
  num_shards: 1
  top_k: 8
  temperature: 1.0
  min_win_prob: 0.55
  output_dir: "data/distill_9m"
  shard_size: 20000

distill:
  lr: 0.0001
  batch_size: 1024
  num_epochs: 1
  warmup_steps: 200
  weight_decay: 0.01
  max_grad_norm: 1.0
  checkpoint_dir: "checkpoints/distill_9m"
  use_wandb: false
  wandb_project: "chess-grpo-pretrain"
  num_workers: 2
  val_check_interval: 0.5
  eval_every_n_epochs: 1

eval:
  games: 8
  seed: 0
  max_plies: 200
  randomize_opening: true
  opening_plies: 6

stockfish:
  path: "/opt/homebrew/bin/stockfish"
  skill_level: 2
  movetime_ms: 20

policy:
  greedy: true

dataset:
  data_dir: "data/distill_9m"
  top_k: 8
  eval_fraction: 0.05

transformer:
  vocab_size: 300
  embed_dim: 256
  num_layers: 4
  num_heads: 8
  action_dim: 1968
