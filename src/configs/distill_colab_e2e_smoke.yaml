# Colab end-to-end smoke profile for distillation stage.

generate:
  teacher_model: "136M"
  checkpoint_dir: "searchless_chess/checkpoints"
  checkpoint_step: 6400000
  teacher_batch_size: 256
  top_k: 64
  teacher_temperature: 2.0
  output_dir: "/content/drive/MyDrive/data/grpo-chess/colab_e2e_smoke/distill_data"
  shard_size: 50000
  min_elo: 1800
  max_samples: 2000000
  skip_first_n_moves: 5
  skip_last_n_moves: 5
  sample_positions_per_game: 3

deepmind_data:
  num_shards: 1
  top_k: 64
  temperature: 2.0
  min_win_prob: 0.50
  output_dir: "/content/drive/MyDrive/data/grpo-chess/colab_e2e_smoke/distill_data"
  shard_size: 50000
  max_samples: 50000

distill:
  lr: 0.00006
  batch_size: 512
  num_epochs: 1
  warmup_steps: 100
  weight_decay: 0.01
  max_grad_norm: 0.5
  distill_lambda_soft: 0.50
  distill_lambda_hard: 0.50
  distill_target_top1_mix_alpha: 0.05
  checkpoint_dir: "/content/drive/MyDrive/data/grpo-chess/colab_e2e_smoke/checkpoints/distill"
  pretrain_checkpoint: "/content/drive/MyDrive/data/grpo-chess/colab_e2e_smoke/checkpoints/pretrain/pretrain_final.pt"
  use_wandb: false
  wandb_project: "chess-grpo-pretrain"
  log_model_artifacts: false
  auto_disable_wandb_if_missing_key: true
  fail_on_nonfinite: false
  max_nonfinite_batches: 50
  require_stockfish_eval: true
  quality_gate_min_val_top1: 0.15
  quality_gate_epoch: 3
  num_workers: 2
  val_check_interval: 1.0
  eval_every_n_epochs: 1000

eval:
  games: 4
  seed: 0
  max_plies: 150
  randomize_opening: true
  opening_plies: 4

stockfish:
  path: "/usr/games/stockfish"
  skill_level: 2
  movetime_ms: 20

policy:
  greedy: true

dataset:
  data_dir: "/content/drive/MyDrive/data/grpo-chess/colab_e2e_smoke/distill_data"
  top_k: 64
  eval_fraction: 0.05
  max_shards: 1

transformer:
  vocab_size: 300
  embed_dim: 256
  num_layers: 4
  num_heads: 8
  action_dim: 1968
