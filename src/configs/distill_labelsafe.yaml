generate:
  teacher_model: "136M"
  checkpoint_dir: "searchless_chess/checkpoints"
  checkpoint_step: 6400000
  teacher_batch_size: 512
  top_k: 8
  teacher_temperature: 1.0
  output_dir: "data/distill"
  shard_size: 50000
  min_elo: 1800
  max_samples: 2000000
  skip_first_n_moves: 5
  skip_last_n_moves: 5
  sample_positions_per_game: 3

deepmind_data:
  num_shards: 50
  top_k: 8
  temperature: 1.0
  min_win_prob: 0.55
  output_dir: "data/distill"
  shard_size: 50000
  max_samples: 300000

distill:
  lr: 0.00003
  batch_size: 1024
  num_epochs: 8
  warmup_steps: 2000
  weight_decay: 0.01
  max_grad_norm: 0.5
  checkpoint_dir: "checkpoints/distill_labelsafe"
  pretrain_checkpoint: "checkpoints/pretrain.ckpt"
  use_wandb: true
  wandb_project: "chess-grpo-pretrain"
  log_model_artifacts: false
  auto_disable_wandb_if_missing_key: true
  fail_on_nonfinite: false
  max_nonfinite_batches: 50
  num_workers: 0
  val_check_interval: 0.1
  eval_every_n_epochs: 1

eval:
  games: 64
  seed: 0
  max_plies: 400
  randomize_opening: true
  opening_plies: 6

stockfish:
  path: "/usr/games/stockfish"
  skill_level: 2
  movetime_ms: 50

policy:
  greedy: true

dataset:
  data_dir: "data/distill"
  top_k: 8
  eval_fraction: 0.05
  max_shards: 16

transformer:
  vocab_size: 300
  embed_dim: 256
  num_layers: 4
  num_heads: 8
  action_dim: 1968
