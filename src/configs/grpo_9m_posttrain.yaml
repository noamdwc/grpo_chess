# GRPO post-training config from a distilled DeepMind 9M warm-start.

training:
  num_epochs: 50
  batch_size: 16
  steps_per_epoch: 512
  checkpoint_dir: "checkpoints/grpo_9m_posttrain"
  checkpoint_every_n_epochs: 5
  keep_n_checkpoints: 3
  use_wandb: false
  wandb_project: "Chess-GRPO-Bot"

grpo:
  lr: 0.000001
  num_trajectories: 8
  trajectory_depth: 12
  clip_ratio: 0.20
  kl_coef: 0.001
  eval_every_n_epochs: 10
  ppo_steps: 1
  rollout_temperature: 1.2
  enable_safety_checks: false
  safety_patience_steps: 1000
  max_clip_fraction: 0.95
  teacher_forcing_prob: 0.1
  teacher_forcing_depth: 4

transformer:
  vocab_size: 300
  embed_dim: 256
  num_layers: 4
  num_heads: 8
  action_dim: 1968

eval:
  games: 32
  seed: 0
  max_plies: 400
  randomize_opening: true
  opening_plies: 6

stockfish:
  path: "/opt/homebrew/bin/stockfish"
  skill_level: 2
  use_elo_limit: false
  elo: 2500
  movetime_ms: 20
  threads: 1
  hash_mb: 128

policy:
  temperature: 0.8
  greedy: true
  branching_factor: 4
  search_depth: 2

searcher: null

pretrain:
  checkpoint_path: "checkpoints/distill_9m/distill_final.pt"
  freeze_layers: 2

dataset:
  max_steps: 512
  phase_distribution:
    opening: 0.33
    middlegame: 0.34
    endgame: 0.33
  min_eval_cp: -200
  max_eval_cp: 200
  quality_filter: true
  stockfish_filter_depth: 4
