# GRPO training using 9M searchless_chess body as initialization.
# Replaces ChessTransformer with 9M-direct policy paths:
#   - exact_9m_warmstart=true (default): exact 9M action-value scorer, checkpoint-faithful startup
#   - exact_9m_warmstart=false: legacy random action-head warmstart

training:
  num_epochs: 400
  batch_size: 4
  steps_per_epoch: 512
  checkpoint_dir: "checkpoints"
  checkpoint_every_n_epochs: 5
  keep_n_checkpoints: 3
  use_wandb: true
  wandb_project: "Chess-GRPO-Bot"

grpo:
  lr: 0.000001  # 1e-6
  num_trajectories: 4
  trajectory_depth: 8
  clip_ratio: 0.20
  kl_coef: 0.001
  eval_every_n_epochs: 10
  ppo_steps: 1
  rollout_temperature: 1.3
  enable_safety_checks: false
  safety_patience_steps: 1000
  max_clip_fraction: 0.95
  teacher_forcing_prob: 0.1
  teacher_forcing_depth: 4

# Unused when use_9m_direct=true; kept for config_loader compatibility
transformer:
  vocab_size: 300
  embed_dim: 256
  num_layers: 4
  num_heads: 8
  action_dim: 1968

eval:
  games: 64
  seed: 0
  max_plies: 400
  randomize_opening: false
  opening_plies: 0

stockfish:
  path: "/usr/games/stockfish"
  skill_level: 2
  use_elo_limit: false
  elo: 2500
  movetime_ms: 20
  threads: 1
  hash_mb: 128

policy:
  temperature: 0.8
  greedy: true
  branching_factor: 4
  search_depth: 2

searcher: null

pretrain:
  checkpoint_path: "checkpoints/jax_9m_converted.pt"
  freeze_layers: 0
  use_9m_direct: true
  exact_9m_warmstart: true

dataset:
  max_steps: 512
  phase_distribution:
    opening: 0.33
    middlegame: 0.34
    endgame: 0.33
  min_eval_cp: -200
  max_eval_cp: 200
  quality_filter: true
  stockfish_filter_depth: 4
